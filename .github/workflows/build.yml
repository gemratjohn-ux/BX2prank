name: Build BX2 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate BX2 project files
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/bx2/prank app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > app/build.gradle.kts <<'BX2_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bx2.prank"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bx2.prank"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          BX2_EOF
          cat > app/src/main/AndroidManifest.xml <<'BX2_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.BX2">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FreezeService" android:exported="false" />
              </application>
          </manifest>
          BX2_EOF
          cat > app/src/main/assets/index.html <<'BX2_EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <title>BX2 Prank</title>
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#0a0710"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BX2 Prank">
          <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#0a0710;--card:#150f1f;--line:#2a1f3d;--red:#ff2e4d;--ice:#8fe3ff;--tx:#efe9f7;--mut:#8a7fa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0a0710}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;overflow-x:hidden}
          body{display:flex;flex-direction:column}
          .mono{font-family:'Share Tech Mono',ui-monospace,monospace;direction:ltr}
          #splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
          #splash h1{font-size:44px;margin:0;letter-spacing:6px;font-weight:800}
          #splash p{color:var(--mut);margin:0}
          .logo{width:120px;height:120px;filter:drop-shadow(0 0 22px #ff2e4d88);animation:pulse 2s infinite}
          @keyframes pulse{50%{filter:drop-shadow(0 0 38px #ff2e4dcc)}}
          header{padding:18px 18px 8px;display:flex;align-items:center;gap:12px}
          header svg{width:44px;height:44px}
          header b{font-size:22px;letter-spacing:3px;font-weight:800}
          header small{display:block;color:var(--mut);font-size:12px}
          #view{flex:1;padding:8px 16px 16px;overflow-y:auto}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;font-weight:800;font-size:17px;color:var(--tx);cursor:pointer}
          .cat i{display:block;font-style:normal;font-size:34px;margin-bottom:8px}
          .cat small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:4px}
          .cat:active,.item:active{transform:scale(.97);border-color:var(--red)}
          .back{background:none;border:0;color:var(--ice);font:inherit;font-size:16px;padding:6px 0 12px;cursor:pointer}
          .item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--tx);font:inherit;font-weight:500;font-size:16px;text-align:start;cursor:pointer}
          .item i{font-style:normal;font-size:24px;width:32px;text-align:center}
          .item span{flex:1}.item em{font-style:normal;color:var(--mut);font-size:12px}
          .set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
          .set label{display:flex;justify-content:space-between;margin-bottom:8px}
          .set input[type=range]{width:100%;accent-color:var(--red)}
          footer{padding:10px;text-align:center;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
          footer b{color:var(--red)}
          #fx{position:fixed;inset:0;z-index:100;display:none;background:#000;overflow:hidden}
          #fx.on{display:block}
          #fx .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;z-index:5;color:#fff;opacity:.18;font-size:22px;background:none;border:0;padding:8px 12px}
          #term{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 40px) 14px 14px;color:#39ff7a;font-size:13px;line-height:1.5;overflow:hidden;white-space:pre-wrap;word-break:break-all}
          .bar{height:10px;border:1px solid #39ff7a;margin-top:8px}.bar div{height:100%;width:0;background:#39ff7a}
          canvas.full{position:absolute;inset:0;width:100%;height:100%}
          .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
          .bsod{background:#0b57d0;color:#fff;align-items:flex-start;text-align:start;direction:ltr;font-family:'Share Tech Mono',monospace}
          .bsod h1{font-size:90px;margin:0}
          .glitch{animation:gl .15s steps(2) infinite}
          @keyframes gl{0%{transform:translate(0)}25%{transform:translate(-8px,4px);filter:hue-rotate(90deg) invert(.2)}50%{transform:translate(9px,-5px);filter:invert(.9)}75%{transform:translate(-5px,-3px);filter:hue-rotate(200deg)}100%{transform:translate(0)}}
          .shake{animation:sh .08s infinite}@keyframes sh{0%{transform:translate(4px,3px)}50%{transform:translate(-4px,-3px)}100%{transform:translate(3px,-4px)}}
          .flash{animation:fl .12s steps(2) infinite}@keyframes fl{50%{background:#fff}}
          .spin{width:46px;height:46px;border:4px solid #444;border-top-color:#fff;border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
          #ice{position:fixed;inset:0;z-index:200;display:none;cursor:none}
          .drip{position:absolute;top:0;width:14px;background:linear-gradient(#a00,#600);border-radius:0 0 8px 8px;animation:dr 3s ease-in forwards}@keyframes dr{from{height:0}to{height:var(--h)}}
          body.frozen *{animation-play-state:paused!important}
          @media (prefers-reduced-motion:reduce){.logo{animation:none}}
          </style>
          </head>
          <body>
          <div id="splash" onclick="enter()">
            <svg class="logo" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#150f1f"/><rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="#ff2e4d" stroke-width="2"/><path d="M60 22c-20 0-32 14-32 31 0 10 4 17 10 22v10h8l2-5 4 5 4-5 4 5 2-5h8V75c6-5 10-12 10-22 0-17-12-31-32-31z" fill="#efe9f7"/><circle cx="47" cy="55" r="8" fill="#0a0710"/><circle cx="73" cy="55" r="8" fill="#0a0710"/><circle cx="47" cy="55" r="3" fill="#ff2e4d"/><circle cx="73" cy="55" r="3" fill="#ff2e4d"/><path d="M60 62l-4 9h8z" fill="#0a0710"/></svg>
            <h1>BX2</h1><p>Prank Terminal</p><p class="mono" style="font-size:12px">اضغط للدخول</p>
            <p style="position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:13px">© BX2 — جميع الحقوق محفوظة</p>
          </div>
          <header>
            <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#150f1f"/><path d="M60 22c-20 0-32 14-32 31 0 10 4 17 10 22v10h8l2-5 4 5 4-5 4 5 2-5h8V75c6-5 10-12 10-22 0-17-12-31-32-31z" fill="#efe9f7"/><circle cx="47" cy="55" r="8" fill="#0a0710"/><circle cx="73" cy="55" r="8" fill="#0a0710"/><circle cx="47" cy="55" r="3" fill="#ff2e4d"/><circle cx="73" cy="55" r="3" fill="#ff2e4d"/></svg>
            <div><b>BX2 PRANK</b><small>تطبيق مقالب — كله تمثيل</small></div>
          </header>
          <div id="view"></div>
          <footer>© <b>BX2</b> 2026 — كل الحقوق محفوظة</footer>
          <div id="fx"></div>
          <div id="ice"></div>

          <script>
          const S={delay:10,dly:false,freeze:10,dur:20,vol:.8,vib:true};
          const $=s=>document.querySelector(s),fx=$('#fx'),view=$('#view');
          let AC,timers=[],stopFns=[],taps=0;
          function enter(){$('#splash').style.opacity=0;fs();try{navigator.wakeLock.request('screen')}catch(e){}setTimeout(()=>$('#splash').remove(),600);try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}home()}
          const sleep=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
          const vib=p=>{if(S.vib)try{navigator.vibrate(p)}catch(e){}};

          /* ---------- sound ---------- */
          function ac(){if(AC&&AC.state==='suspended')AC.resume();return AC}
          function g(v=1){const n=ac().createGain();n.gain.value=v*S.vol;n.connect(AC.destination);return n}
          function osc(type,f1,f2,dur,v=.5){if(!ac())return;const o=AC.createOscillator(),o_g=g(v);o.type=type;o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+dur);o_g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(o_g);o.start();o.stop(AC.currentTime+dur);}
          function noise(dur,v=.5,fq=0){if(!ac())return null;const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const o_g=g(v);let n=s;if(fq){const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=4;s.connect(f);n=f}n.connect(o_g);s.start();return o_g}
          const snd={
           scream(){osc('sawtooth',500,1800,1.4,.6);osc('square',700,2400,1.2,.35);noise(1.2,.5,2500);vib([300,80,300])},
           bass(){osc('sine',90,30,1.5,1);noise(.4,.6,120)},
           beep(){osc('square',1200,1200,.12,.25)},
           static_(){noise(1.2,.6)},
           heart(){for(let i=0;i<10;i++){timers.push(setTimeout(()=>{osc('sine',70,35,.18,1)},i*900));timers.push(setTimeout(()=>{osc('sine',60,30,.15,.7)},i*900+260))}vib([80,150,80,700,80,150,80,700])},
           whisper(){const n=noise(6,.5,3200);if(n)for(let i=0;i<12;i++)n.gain.setValueAtTime(Math.random()*.5*S.vol,AC.currentTime+i*.5)},
           siren(){for(let i=0;i<8;i++)timers.push(setTimeout(()=>osc('sawtooth',i%2?600:900,i%2?900:600,.5,.3),i*500))},
           glass(){noise(.5,.8,6000);osc('triangle',3000,800,.4,.3)},
           knock(){[0,300,600,1400,1700].forEach(t=>timers.push(setTimeout(()=>{osc('sine',160,60,.12,1);vib(60)},t)))},
           laugh(){for(let i=0;i<6;i++)timers.push(setTimeout(()=>osc('sawtooth',300-i*20,200-i*15,.18,.4),i*230))},
           drone(){osc('sawtooth',55,50,5,.5);osc('sawtooth',58,52,5,.5)},cry(){for(let i=0;i<5;i++)timers.push(setTimeout(()=>osc('sawtooth',420,640,.5,.35),i*700))},breath(){for(let i=0;i<4;i++)timers.push(setTimeout(()=>noise(.9,.5,900),i*1400))},chains(){for(let i=0;i<14;i++)timers.push(setTimeout(()=>noise(.07,.7,5000),i*130+rnd(0,60)))},scratch(){noise(1.2,.5,6500)}
          };

          /* ---------- visuals ---------- */
          function face(k){
           if(k==='skull')return SKULL;
           const eyes=k==='eyes'?Array.from({length:14},()=>{const x=20+Math.random()*360,y=20+Math.random()*460,r=10+Math.random()*22;return `<ellipse cx="${x}" cy="${y}" rx="${r*1.5}" ry="${r}" fill="#e8e0d0"/><circle cx="${x}" cy="${y}" r="${r*.5}" fill="#c00"/><circle cx="${x}" cy="${y}" r="${r*.2}" fill="#000"/>`}).join(''):'';
           if(k==='eyes')return `<svg viewBox="0 0 400 500" class="full" style="position:absolute;inset:0;width:100%;height:100%;background:#050000" preserveAspectRatio="xMidYMid slice">${eyes}</svg>`;
           const teeth=Array.from({length:12},(_,i)=>`<path d="M${108+i*15} 345l7 ${30+(i%3)*8}l7-${30+(i%3)*8}z" fill="#d8d0b8"/><path d="M${108+i*15} 410l7-${22+(i%2)*10}l7 ${22+(i%2)*10}z" fill="#d8d0b8"/>`).join('');
           return `<svg viewBox="0 0 400 500" style="position:absolute;inset:0;width:100%;height:100%" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="r"><stop offset="0" stop-color="#400"/><stop offset="1" stop-color="#000"/></radialGradient></defs><rect width="400" height="500" fill="url(#r)"/><path d="M200 30c-95 0-140 80-135 190 3 90 40 190 135 250 95-60 132-160 135-250C340 110 295 30 200 30z" fill="#cfc8b4"/><path d="M80 150c40-30 70-5 90 20M320 150c-40-30-70-5-90 20" stroke="#222" stroke-width="7" fill="none"/><ellipse cx="140" cy="215" rx="42" ry="52" fill="#000"/><ellipse cx="260" cy="215" rx="42" ry="52" fill="#000"/><circle cx="140" cy="222" r="9" fill="#f00"/><circle cx="260" cy="222" r="9" fill="#f00"/><path d="M200 255l-14 55h28z" fill="#111"/><path d="M100 345Q200 440 300 345Q200 485 100 345z" fill="#120000"/><ellipse cx="200" cy="385" rx="95" ry="52" fill="#080000"/>${teeth}<path d="M120 280c-6 40-4 90 4 130M283 270c8 50 6 100-2 140" stroke="#800" stroke-width="3" fill="none"/></svg>`}
          function show(html,cls=''){stop(false);fx.className='on '+cls;fx.innerHTML=`<button class="x" onclick="stop()">✕</button>`+html;fx.onclick=()=>{taps++;setTimeout(()=>taps=0,700);if(taps>=3)stop()};}
          function stop(full=true){timers.forEach(clearTimeout);timers=[];stopFns.forEach(f=>f());stopFns=[];document.body.classList.remove('frozen');$('#ice').style.display='none';try{navigator.vibrate(0)}catch(e){}if(AC&&full)AC.suspend().then(()=>AC.resume());fx.className='';fx.innerHTML='';fx.onclick=null}
          function autoStop(ms){timers.push(setTimeout(stop,ms))}

          /* ---------- actions ---------- */
          async function terminal(title,lines,end,endCol='#39ff7a'){
           show(`<div id="term" class="mono"></div>`);const t=$('#term');let out=`<b>${title}</b>\n`;t.innerHTML=out;
           for(const l of lines){snd.beep();out+=`> ${l}\n`;t.innerHTML=out+'<div class="bar"><div id="pb"></div></div>';const pb=$('#pb');
            for(let p=0;p<=100;p+=20){pb.style.width=p+'%';await sleep(90+Math.random()*160)}
            out+=`  [OK] ${Math.random().toString(16).slice(2,10)}\n`;t.scrollTop=1e5}
           t.innerHTML=out+`\n<b style="color:${endCol};font-size:22px">${end}</b>`;vib([200,100,200]);
          }
          const ips=()=>`${rnd(10,250)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`,rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
          function matrix(){show(`<canvas class="full"></canvas>`);const c=fx.querySelector('canvas');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),cols=Math.floor(c.width/16),y=Array(cols).fill(0);const id=setInterval(()=>{x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#39ff7a';x.font='16px monospace';y.forEach((v,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*90),i*16,v*16);y[i]=v*16>c.height&&Math.random()>.97?0:v+1})},50);stopFns.push(()=>clearInterval(id));autoStop(S.dur*1000)}
          function glitch(){show(`<div class="center glitch" style="background:#111"><h1 class="mono" style="color:#ff2e4d;font-size:40px">SYSTEM ERROR</h1><p class="mono">0xDEAD${rnd(1000,9999)} — memory corrupted</p></div>`);loop(snd.static_,1200);vib([100,50,100,50,200]);autoStop(S.dur*1000)}
          async function freeze(){
           if(window.BX2){const d=S.dly?S.delay:3;BX2.freezeAll(d,S.freeze);note('بعد '+d+'ث يتجمد الجوال كله لمدة '+S.freeze+'ث');return}
           fs();snd.drone();const ice=$('#ice');ice.style.display='block';['touchstart','touchend','click','pointerdown'].forEach(e=>ice.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));try{history.pushState(null,'',location.href)}catch(e){}await new Promise(r=>setTimeout(r,400));const end=performance.now()+S.freeze*1000;while(performance.now()<end){}
           await new Promise(r=>setTimeout(r,800));ice.style.display='none';jump('rand');
          }
          async function freezeSoft(){
           const sec=S.freeze;document.body.classList.add('frozen');const ice=$('#ice');ice.style.display='block';
           ['touchstart','touchmove','click','keydown'].forEach(e=>ice.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
           await new Promise(r=>setTimeout(r,sec*1000));ice.style.display='none';document.body.classList.remove('frozen');
           show(`<div class="center" style="background:#fff;color:#000"><h2>⚠️ التطبيق لا يستجيب</h2></div>`);snd.glass();await sleep(700);jump('face');
          }
          function bsod(){show(`<div class="center bsod"><h1>:(</h1><div style="font-size:20px">Your device ran into a problem and needs to restart.</div><div class="mono" style="opacity:.8;margin-top:10px">Stop code: CRITICAL_PROCESS_DIED<br>BX2_KERNEL_0x0000007E</div><div style="margin-top:20px">0% complete</div></div>`);snd.bass();vib(500)}
          async function update(){show(`<div class="center" style="background:#000"><div class="spin"></div><div id="u" class="mono">Updating… 0%</div><small style="color:#888">لا تطفي الجهاز</small></div>`);for(let i=0;i<=100;i+=4){const u=$('#u');if(!u)return;u.textContent=`Updating… ${i}%`;await sleep(i>90?900:200)}$('#u')&&jump('face')}
          function battery(){show(`<div class="center" style="background:#000"><div style="font-size:70px">🪫</div><h2 style="color:#ff2e4d">البطارية 1%</h2><p>الجهاز سيتم إيقافه…</p></div>`);snd.beep();timers.push(setTimeout(()=>fx.innerHTML='',3500));timers.push(setTimeout(()=>{show('<div style="position:absolute;inset:0;background:#000"></div>')},3600))}
          function crack(){let p='';for(let i=0;i<9;i++){let x=200,y=250,d='M200 250';for(let j=0;j<7;j++){x+=Math.cos(i*.7)*45+rnd(-18,18);y+=Math.sin(i*.7)*45+rnd(-18,18);d+=`L${x} ${y}`}p+=`<path d="${d}" stroke="#fff" stroke-width="1.6" fill="none" opacity=".9"/>`}
           show(`<svg viewBox="0 0 400 500" style="position:absolute;inset:0;width:100%;height:100%;background:#ffffff10" preserveAspectRatio="none">${p}<circle cx="200" cy="250" r="9" fill="#fff"/></svg>`,'');fx.style.background='transparent';fx.style.pointerEvents='auto';snd.glass();vib(200);timers.push(setTimeout(()=>{fx.style.background=''},9999999))}
          function black(){show('<div style="position:absolute;inset:0;background:#000"></div>');snd.drone()}
