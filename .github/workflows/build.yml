          package com.bx2.prank

          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.view.WindowManager

          /** Real full-phone freeze: a transparent overlay that swallows every touch for N seconds (10..100), then removes itself. */
          class FreezeService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var overlay: View? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val delay = (intent?.getIntExtra("delay", 0) ?: 0).coerceIn(0, 100)
                  val dur = (intent?.getIntExtra("dur", 10) ?: 10).coerceIn(10, 100)   // hard limit: never longer than 100s
                  h.postDelayed({ show(dur) }, delay * 1000L)
                  return START_NOT_STICKY
              }

              private fun show(dur: Int) {
                  if (!Settings.canDrawOverlays(this)) { stopSelf(); return }
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  val v = View(this)
                  v.setBackgroundColor(0x01000000)          // practically invisible, so the screen looks frozen
                  v.setOnTouchListener { _, _ -> true }     // eat all touches
                  wm.addView(v, lp)
                  overlay = v
                  h.postDelayed({ finishFreeze() }, dur * 1000L)
              }

              private fun removeOverlay() {
                  overlay?.let { try { (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it) } catch (_: Exception) {} }
                  overlay = null
              }

              private fun finishFreeze() {
                  removeOverlay()
                  val i = Intent(this, MainActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      .putExtra("scare", true)
                  try { startActivity(i) } catch (_: Exception) {}
                  stopSelf()
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  removeOverlay()
                  super.onDestroy()
              }
          }
          BX2_EOF
