                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#0A0710"))
                  setContentView(web)
                  hideBars()

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  web.addJavascriptInterface(Bridge(), "BX2")

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? =
                          loader.shouldInterceptRequest(request.url)
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.resources)
                              } else {
                                  pending = request
                                  camPerm.launch(Manifest.permission.CAMERA)
                              }
                          }
                      }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
                  handle(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handle(intent)
              }

              private fun handle(i: Intent?) {
                  if (i?.getBooleanExtra("scare", false) == true) {
                      i.removeExtra("scare")
                      web.postDelayed({ web.evaluateJavascript("jump('rand')", null) }, 400)
                  }
              }

              private fun hideBars() {
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun freezeAll(delay: Int, dur: Int) {
                      runOnUiThread {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "فعّل خيار العرض فوق التطبيقات ثم ارجع", Toast.LENGTH_LONG).show()
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                              return@runOnUiThread
                          }
                          startService(Intent(this@MainActivity, FreezeService::class.java).putExtra("delay", delay).putExtra("dur", dur))
                          moveTaskToBack(true)
                      }
                  }
              }
          }
